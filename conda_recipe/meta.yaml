package:
  name: knotergy
  version: "0.3.1"

source:
  path: ..

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake >=3.15
    - make
    - pkg-config
    - git

  host:
    - libstdcxx-ng  # [linux]
    - libcxx        # [osx]

  run:
    - libstdcxx-ng  # [linux]
    - libcxx        # [osx]

test:
  commands:
    - Knotergy --help
    - Knotergy -s "AAAPUUU" -r "(.....)" -m

about:
  home: https://github.com/TheCOBRALab/Knotergy
  summary: "Knotergy is an algorithm for evaluating pseudoknotted secondary structures of RNA."
  description: |
    Knotergy evaluates RNA secondary structure.
  dev_url: https://github.com/TheCOBRALab/Knotergy

extra:
  recipe-maintainers:
    - PointlessUser